<div class="tripulante-container">

  <div class="header-card">
    <div>
      <span class="badge">Administración</span>
      <h1>Registrar Tripulante</h1>
      <p>Registra pilotos, copilotos, ingenieros de vuelo y tripulantes de cabina.</p>
    </div>
  </div>

  <div class="form-card">

    <div class="form-grid">

      <div class="form-group">
        <label>Nombre</label>
        <input
          type="text"
          [(ngModel)]="tripulante.nombre"
          placeholder="Ingrese el nombre">
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <input
          type="text"
          [(ngModel)]="tripulante.apellido"
          placeholder="Ingrese el apellido">
      </div>

      <div class="form-group">
        <label>Licencia</label>
        <input
          type="text"
          [(ngModel)]="tripulante.licencia"
          placeholder="Ejemplo: LIC-PIL-001">
      </div>

      <div class="form-group">
        <label>Aerolínea</label>
        <select [(ngModel)]="tripulante.idAerolinea">
          <option [ngValue]="0">Seleccione una aerolínea</option>
          <option *ngFor="let aerolinea of aerolineas" [ngValue]="aerolinea.idAerolinea">
            {{ aerolinea.nombre }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Cargo</label>
        <select [(ngModel)]="tripulante.idCargoTripulante">
          <option [ngValue]="0">Seleccione un cargo</option>
          <option *ngFor="let cargo of cargos" [ngValue]="cargo.id">
            {{ cargo.valor }}
          </option>
        </select>
      </div>

    </div>

    <div class="mensaje error" *ngIf="mensajeError">
      {{ mensajeError }}
    </div>

    <div class="mensaje exito" *ngIf="mensajeExito">
      {{ mensajeExito }}
    </div>


    <div class="acciones">
      <button type="button" class="btn-secundario" (click)="limpiarFormulario()">
        Limpiar
      </button>

      <button type="button" class="btn-principal" (click)="guardar()">
        Guardar
      </button>
    </div>

  </div>

</div>
