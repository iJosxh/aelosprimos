<div class="layout">

  <app-sidebar
    class="sidebar-wrapper"
    [class.sidebar-open]="sidebarAbierto"
    [rol]="rol">
  </app-sidebar>

  <div
    class="sidebar-overlay"
    *ngIf="sidebarAbierto"
    (click)="cerrarSidebar()">
  </div>

  <div class="main-content">

    <app-navbar (abrirMenu)="toggleSidebar()"></app-navbar>

    <div class="contenido">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
